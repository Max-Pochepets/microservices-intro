apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-pv" .Values.songs.name }}
  namespace: {{ required "namespace is required!" .Values.namespace }}
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: manual
  hostPath:
    path: /mnt/data
